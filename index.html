<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 5A — Parent View</title>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<style>
:root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2335;--border:#2a3050;--accent:#00c896;--accent2:#0099ff;--warn:#ffb300;--danger:#ff4757;--text:#e8eaf0;--text2:#8892b0;--text3:#4a5568;--mono:"Courier New",monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
[data-theme="light"]{--bg:#f4f6fb;--surface:#ffffff;--surface2:#eef0f7;--border:#d0d7e8;--text:#1a1f36;--text2:#4a5568;--text3:#9aa5b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;transition:background .2s,color .2s;}

#code-screen{position:fixed;inset:0;background:var(--bg);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;}
.code-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px;text-align:center;width:100%;max-width:360px;}
.code-title{font-size:20px;font-weight:600;margin-bottom:6px;}
.code-sub{font-size:12px;color:var(--text2);margin-bottom:22px;line-height:1.5;}
.code-box input{width:100%;padding:13px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:6px;font-size:16px;text-align:center;letter-spacing:1px;background:var(--surface2);color:var(--text);font-family:var(--mono);}
.code-box button.submit{width:100%;padding:13px;background:var(--accent);color:#000;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;}
.code-err{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px;}
.code-note{font-size:11px;color:var(--text2);margin-top:16px;padding:10px;background:var(--surface2);border-radius:6px;line-height:1.5;text-align:left;}
.theme-toggle-code{position:absolute;top:20px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.hname{font-size:16px;font-weight:600;}
.hsub{font-size:12px;color:var(--text2);margin-top:2px;}
.hright{display:flex;gap:8px;}
.tbtn,.lbtn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:7px 12px;cursor:pointer;font-size:12px;font-family:var(--sans);}
.tbtn:hover{border-color:var(--accent);color:var(--accent);}
.lbtn:hover{border-color:var(--danger);color:var(--danger);}

main{max-width:640px;margin:0 auto;padding:24px 20px;}
.sectiontitle{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin:24px 0 10px;}
.sectiontitle:first-child{margin-top:0;}

.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 4px;text-align:center;}
.day-label{font-size:10px;color:var(--text2);text-transform:uppercase;margin-bottom:8px;}
.day-mark{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;margin:0 auto;}
.day-mark.present{background:rgba(0,200,150,.15);color:var(--accent);}
.day-mark.absent{background:rgba(255,71,87,.13);color:var(--danger);}
.day-mark.none{background:var(--surface2);color:var(--text3);}

.tw{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border);background:var(--surface2);}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono);}
.bok{background:rgba(0,200,150,.15);color:var(--accent);}
.bpos{background:rgba(0,200,150,.15);color:var(--accent);}
.bcon{background:rgba(255,71,87,.13);color:var(--danger);}
.bgen{background:rgba(0,153,255,.13);color:var(--accent2);}

.note-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
.note-line{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:13px;}
.note-date{color:var(--text3);font-size:11px;font-family:var(--mono);}

.empty{text-align:center;padding:36px;color:var(--text3);font-size:13px;}
.hidden{display:none!important;}
.banner{font-size:13px;padding:10px 14px;border-radius:6px;margin-bottom:16px;}
.banner.error{background:#fbeee7;color:#a5502f;border:1px solid #e9c4ac;}
</style>
</head>
<body>

<!-- ACCESS CODE SCREEN -->
<div id="code-screen">
  <button class="theme-toggle-code" id="codeThemeToggle">☀️ Light</button>
  <div class="code-box">
    <div class="code-title">Class 5A</div>
    <div class="code-sub">Enter your child's access code to view their attendance, grades, and notes.</div>
    <input type="text" id="codeInput" placeholder="e.g. a1b2-c3d4-e5f6" autocomplete="off" autocapitalize="off">
    <button class="submit" id="codeBtn">View</button>
    <div class="code-err" id="codeError"></div>
    <div class="code-note">This code was given to you by your child's teacher. It only shows information for your own child — nothing else.</div>
  </div>
</div>

<!-- MAIN VIEW -->
<div id="appShell" class="hidden">
  <header>
    <div>
      <div class="hname" id="studentNameHeader">—</div>
      <div class="hsub">Class 5A</div>
    </div>
    <div class="hright">
      <button class="tbtn" id="themeToggle">☀️ Light</button>
      <button class="lbtn" id="switchBtn">Switch child</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>
  // ============================================================
  // PARENT VIEW — read-only. Never writes to Firestore.
  //
  // A parent enters their child's access code; the app fetches
  // ONE student document directly by that ID (a "get", not a
  // "list") — so even under the locked-down security rules
  // (not the current open testing rules), this pattern only ever
  // exposes the one child whose exact code was entered. There is
  // no way to browse, search, or discover other students from here.
  // ============================================================

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBIX7pTbcxdbhv9bD04zCYZm_SaWmoFKSg",
    authDomain: "classmanager-2776b.firebaseapp.com",
    projectId: "classmanager-2776b",
    storageBucket: "classmanager-2776b.firebasestorage.app",
    messagingSenderId: "982534297826",
    appId: "1:982534297826:web:fbee27b128f862837fe6bb"
  };

  let db;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch (err) {
    console.error("Firebase failed to initialize:", err);
  }

  const THEME_KEY = "classroom_5a_theme";
  let student = null;

  function applyTheme(theme) {
    if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
    const label = theme === "light" ? "🌙 Dark" : "☀️ Light";
    const t1 = document.getElementById("themeToggle");
    const t2 = document.getElementById("codeThemeToggle");
    if (t1) t1.textContent = label;
    if (t2) t2.textContent = label;
  }
  function toggleTheme() {
    const current = localStorage.getItem(THEME_KEY) || "dark";
    const next = current === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
  function average(scores) {
    if (!scores.length) return "—";
    return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
  }
  function catClass(cat) { return cat === "positive" ? "bpos" : cat === "concern" ? "bcon" : "bgen"; }
  function catLabel(cat) { return cat === "positive" ? "Positive" : cat === "concern" ? "Concern" : "General"; }

  function getWeekDates() {
    const d = new Date();
    const day = d.getDay();
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const monday = new Date(d);
    monday.setDate(d.getDate() + mondayOffset);
    const dates = [];
    for (let i = 0; i < 5; i++) {
      const dt = new Date(monday);
      dt.setDate(monday.getDate() + i);
      dates.push(dt.toISOString().slice(0, 10));
    }
    return dates;
  }
  const weekDates = getWeekDates();
  const weekDayLabels = ["Mon", "Tue", "Wed", "Thu", "Fri"];

  async function lookupStudent(code) {
    const errorEl = document.getElementById("codeError");
    errorEl.textContent = "";
    if (!code) {
      errorEl.textContent = "Enter an access code.";
      return;
    }
    if (!db) {
      errorEl.textContent = "Could not connect to the server. Check your connection and try again.";
      return;
    }
    try {
      const doc = await db.collection("students").doc(code).get();
      if (!doc.exists) {
        errorEl.textContent = "No student found for that code. Double-check with your child's teacher.";
        return;
      }
      const [attSnap, gradesSnap, notesSnap] = await Promise.all([
        db.collection("students").doc(code).collection("attendance").get(),
        db.collection("students").doc(code).collection("grades").get(),
        db.collection("students").doc(code).collection("notes").get(),
      ]);
      const attendance = {};
      attSnap.forEach((d) => { attendance[d.id] = d.data().status; });
      const grades = [];
      gradesSnap.forEach((d) => { grades.push({ assignment: d.id, score: d.data().score }); });
      const notes = [];
      notesSnap.forEach((d) => { notes.push({ id: d.id, ...d.data() }); });
      notes.sort((a, b) => (a.date < b.date ? 1 : -1));

      student = { accessCode: code, ...doc.data(), attendance, grades, notes };
      localStorage.setItem("parent_last_code", code);
      showApp();
    } catch (err) {
      console.error(err);
      errorEl.textContent = "Something went wrong looking up that code. Try again.";
    }
  }

  function showApp() {
    document.getElementById("code-screen").classList.add("hidden");
    document.getElementById("appShell").classList.remove("hidden");
    document.getElementById("appShell").style.display = "block";
    document.getElementById("studentNameHeader").textContent = student.name;
    render();
  }

  document.getElementById("codeBtn").addEventListener("click", () => {
    const code = document.getElementById("codeInput").value.trim();
    lookupStudent(code);
  });
  document.getElementById("codeInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("codeBtn").click();
  });

  document.getElementById("switchBtn").addEventListener("click", () => {
    student = null;
    document.getElementById("appShell").classList.add("hidden");
    document.getElementById("code-screen").classList.remove("hidden");
    document.getElementById("codeInput").value = "";
    document.getElementById("codeError").textContent = "";
  });

  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("codeThemeToggle").addEventListener("click", toggleTheme);
  applyTheme(localStorage.getItem(THEME_KEY) || "dark");

  function render() {
    const weekBoxes = weekDates.map((d, i) => {
      const status = student.attendance[d];
      const cls = status === "present" ? "present" : status === "absent" ? "absent" : "none";
      const symbol = status === "present" ? "✓" : status === "absent" ? "✕" : "–";
      return `
        <div class="day-card">
          <div class="day-label">${weekDayLabels[i]}</div>
          <div class="day-mark ${cls}">${symbol}</div>
        </div>
      `;
    }).join("");

    const gradeRows = student.grades.filter((g) => g.score !== null && g.score !== undefined).map((g) => `
      <tr><td>${escapeHtml(g.assignment)}</td><td><span class="badge bok">${g.score}</span></td></tr>
    `).join("");
    const scores = student.grades.map((g) => g.score).filter((v) => v !== null && v !== undefined);

    const notesHtml = student.notes.map((n) => `
      <div class="note-card">
        <div class="note-line">
          <span class="note-date">${n.date}</span>
          <span class="badge ${catClass(n.category || 'general')}">${catLabel(n.category || 'general')}</span>
          <span>${escapeHtml(n.text)}</span>
        </div>
      </div>
    `).join("");

    document.getElementById("main").innerHTML = `
      <div class="sectiontitle">This week's attendance</div>
      <div class="week-grid">${weekBoxes}</div>

      <div class="sectiontitle">Grades</div>
      ${gradeRows ? `
        <div class="tw">
          <table><thead><tr><th>Assignment</th><th>Score</th></tr></thead><tbody>${gradeRows}</tbody></table>
        </div>
        <div style="text-align:right; margin-top:8px; font-size:12px; color:var(--text2);">Average: <span class="badge bok">${average(scores)}</span></div>
      ` : `<div class="empty">No grades recorded yet.</div>`}

      <div class="sectiontitle">Teacher notes</div>
      ${notesHtml || `<div class="empty">No notes yet.</div>`}
    `;
  }

  // Convenience: if this browser looked up a code before, offer it again.
  const lastCode = localStorage.getItem("parent_last_code");
  if (lastCode) {
    document.getElementById("codeInput").value = lastCode;
  }
</script>
</body>
</html>
